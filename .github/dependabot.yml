# Weekly, grouped: one PR for all minor/patch updates per ecosystem, one for security fixes.
# Majors stay separate PRs. Cooldown: no version younger than 7 days (security fixes are exempt).
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/solutions/aoc-25-01"
      - "/solutions/aoc-25-02"
      - "/solutions/aoc-25-04"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - "/"
      - "/solutions/aoc-25-03"
      - "/solutions/aoc-25-05"
      - "/solutions/aoc-25-06"
      - "/solutions/aoc-25-07"
      - "/solutions/aoc-25-08"
      - "/solutions/aoc-25-09"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
